<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Seal Dojo - browser spike</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 12px; background: #111; color: #eee; }
  button, select, input { font-size: 16px; padding: 8px; margin: 4px 4px 4px 0; }
  video { width: 100%; max-width: 480px; background: #000; transform: scaleX(-1); }
  pre, textarea { background: #000; color: #9f9; padding: 8px; width: 100%;
                  box-sizing: border-box; white-space: pre-wrap; font-size: 13px; }
  textarea { height: 240px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/ort.all.min.js"></script>
</head>
<body>
<h3>Hand Seal Dojo: browser spike</h3>
<pre id="env"></pre>
<div>
  Backend: <select id="ep"><option>wasm</option><option>webgpu</option><option>webgl</option></select>
  Seconds: <input id="secs" type="number" value="30" style="width:80px">
</div>
<div>
  <button id="btnLoad">1. Load model</button>
  <button id="btnParity">2. Parity test</button>
  <button id="btnBench">3. Camera benchmark</button>
  <button id="btnStop">Stop</button>
  $('btnClear').onclick = () => { lines.length = 0; $('report').value = ''; try { localStorage.removeItem('spikeLog'); } catch (e) {} };
</div>
<video id="video" playsinline muted></video>
<pre id="live"></pre>
<textarea id="report" readonly></textarea>

<script>
const SZ = 416, STRIDES = [8, 16, 32], NMS_TH = 0.45, SCORE_TH = 0.1;
const NAMES = ["Rat","Ox","Tiger","Hare","Dragon","Snake","Horse","Ram","Monkey","Bird","Dog","Boar","Gassho","Unknown","Mizunoe"];
const $ = id => document.getElementById(id);
let session = null, inputName = null, outputName = null, stop = false;
const lines = [];
function log(s) {
  lines.push(s);
  $('report').value = lines.join('\n'); $('report').scrollTop = 1e9;
  try { localStorage.setItem('spikeLog', JSON.stringify(lines.slice(-300))); } catch (e) {}
}
// restore the log after a reload or tab crash
try {
  JSON.parse(localStorage.getItem('spikeLog') || '[]').forEach(l => lines.push(l));
  const unfinished = localStorage.getItem('spikeRunning');
  if (unfinished) { lines.push('!! PREVIOUS RUN DID NOT FINISH (tab crash?) at: ' + unfinished); localStorage.removeItem('spikeRunning'); }
  $('report').value = lines.join('\n');
} catch (e) {}

if (typeof ort !== 'undefined') {
  ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/';
}
$('env').textContent = [
  'userAgent: ' + navigator.userAgent,
  'isSecureContext: ' + isSecureContext,
  'crossOriginIsolated: ' + crossOriginIsolated,
  'WebGPU available: ' + (!!navigator.gpu),
  'hardwareConcurrency: ' + navigator.hardwareConcurrency,
  'deviceMemory (GB, approximate): ' + (navigator.deviceMemory || 'n/a'),
  'screen: ' + screen.width + 'x' + screen.height + ' @' + devicePixelRatio,
  'onnxruntime-web: ' + (typeof ort !== 'undefined' ? (ort.env.versions && ort.env.versions.web) : 'NOT LOADED'),
].join('\n');

// ---- anchor grid (same as yolox_onnx.py) ----
const grid = (() => {
  let n = 0; for (const s of STRIDES) n += (SZ / s) * (SZ / s);
  const gx = new Float32Array(n), gy = new Float32Array(n), st = new Float32Array(n);
  let i = 0;
  for (const s of STRIDES) { const m = SZ / s; for (let y = 0; y < m; y++) for (let x = 0; x < m; x++) { gx[i] = x; gy[i] = y; st[i] = s; i++; } }
  return { gx, gy, st, n };
})();

// ---- preprocessing: letterbox to 416 with 114 padding, BGR, 0-255, CHW ----
const work = document.createElement('canvas'); work.width = work.height = SZ;
const wctx = work.getContext('2d', { willReadFrequently: true });
const inputData = new Float32Array(3 * SZ * SZ);
function preprocess(src, sw, sh, mirror) {
  wctx.setTransform(1, 0, 0, 1, 0, 0);
  wctx.fillStyle = 'rgb(114,114,114)';
  wctx.fillRect(0, 0, SZ, SZ);
  const ratio = Math.min(SZ / sh, SZ / sw);
  const nw = Math.floor(sw * ratio), nh = Math.floor(sh * ratio);
  if (mirror) { wctx.translate(nw, 0); wctx.scale(-1, 1); }
  wctx.drawImage(src, 0, 0, sw, sh, 0, 0, nw, nh);
  wctx.setTransform(1, 0, 0, 1, 0, 0);
  const d = wctx.getImageData(0, 0, SZ, SZ).data, plane = SZ * SZ;
  for (let i = 0, p = 0; i < plane; i++, p += 4) {
    inputData[i] = d[p + 2]; inputData[plane + i] = d[p + 1]; inputData[2 * plane + i] = d[p];
  }
  return ratio;
}

// ---- postprocessing: decode, class-agnostic NMS (same rules as the Python) ----
function iouPlus1(a, b) {
  const w = Math.max(0, Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1) + 1);
  const h = Math.max(0, Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1) + 1);
  const inter = w * h;
  const A = (a.x2 - a.x1 + 1) * (a.y2 - a.y1 + 1), B = (b.x2 - b.x1 + 1) * (b.y2 - b.y1 + 1);
  return inter / (A + B - inter);
}
function postprocess(out, dims, ratio) {
  const N = dims[1], D = dims[2], C = D - 5;
  if (N !== grid.n) log('WARNING: output has ' + N + ' anchors, expected ' + grid.n);
  const cand = [];
  for (let i = 0; i < N; i++) {
    const o = i * D, obj = out[o + 4];
    if (obj <= SCORE_TH) continue;
    let bc = 0, bv = out[o + 5];
    for (let c = 1; c < C; c++) { const v = out[o + 5 + c]; if (v > bv) { bv = v; bc = c; } }
    const score = obj * bv;
    if (score <= SCORE_TH) continue;
    const s = grid.st[i];
    const cx = (out[o] + grid.gx[i]) * s, cy = (out[o + 1] + grid.gy[i]) * s;
    const w = Math.exp(out[o + 2]) * s, h = Math.exp(out[o + 3]) * s;
    cand.push({ x1: (cx - w / 2) / ratio, y1: (cy - h / 2) / ratio, x2: (cx + w / 2) / ratio, y2: (cy + h / 2) / ratio, score, cls: bc });
  }
  cand.sort((a, b) => b.score - a.score);
  const keep = [];
  for (const c of cand) {
    let ok = true;
    for (const k of keep) { if (iouPlus1(c, k) > NMS_TH) { ok = false; break; } }
    if (ok) keep.push(c);
  }
  return keep;
}
function bestByClass(keep) {
  const best = {};
  for (const k of keep) { const n = NAMES[k.cls] || ('id' + k.cls); if (!(n in best) || k.score > best[n]) best[n] = k.score; }
  return best;
}
function topOf(best) {
  let t = null, v = 0;
  for (const n in best) if (best[n] > v) { v = best[n]; t = n; }
  return { name: t, score: v };
}
const pct = (arr, p) => { if (!arr.length) return NaN; const a = [...arr].sort((x, y) => x - y); return a[Math.min(a.length - 1, Math.floor(p * a.length))]; };
const tensor = () => new ort.Tensor('float32', inputData, [1, 3, SZ, SZ]);

// ---- 1. load ----
async function loadModel() {
  const ep = $('ep').value;
  session = null;
  const t0 = performance.now();
  try {
    ort.env.wasm.numThreads = crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 2) : 1;
    const buf = await (await fetch('yolox_nano.onnx')).arrayBuffer();
    const t1 = performance.now();
    session = await ort.InferenceSession.create(buf, { executionProviders: [ep], graphOptimizationLevel: 'all' });
    inputName = session.inputNames[0]; outputName = session.outputNames[0];
    inputData.fill(114);
    const w0 = performance.now(); await session.run({ [inputName]: tensor() });
    const w1 = performance.now(); for (let i = 0; i < 3; i++) await session.run({ [inputName]: tensor() });
    const w2 = performance.now();
    log(`MODEL backend=${ep} threads=${ort.env.wasm.numThreads} fetch ${(t1 - t0).toFixed(0)} ms, create ${(w0 - t1).toFixed(0)} ms, first run ${(w1 - w0).toFixed(0)} ms, warm run ${((w2 - w1) / 3).toFixed(0)} ms`);
  } catch (e) { log(`LOAD FAILED (${ep}): ${e}`); }
}

// ---- 2. parity ----
async function parity() {
  if (!session) return log('Load the model first.');
  const exp = await (await fetch('parity_expected.json')).json();
  const files = Object.keys(exp);
  let agree = 0; const diffs = [], bad = [];
  for (const fn of files) {
    try { localStorage.setItem('spikeRunning', 'parity image ' + (agree + bad.length + 1) + '/' + files.length); } catch (e) {}
    const bmp = await createImageBitmap(await (await fetch('parity/' + fn)).blob());
    const ratio = preprocess(bmp, bmp.width, bmp.height, false);
    const res = await session.run({ [inputName]: tensor() });
    const best = bestByClass(postprocess(res[outputName].data, res[outputName].dims, ratio));
    const top = topOf(best), e = exp[fn];
    if (top.name === e.top) agree++;
    else bad.push(`${fn}: browser=${top.name}(${top.score.toFixed(2)}) python=${e.top}(${(e.top_score || 0).toFixed(2)})`);
    if (e.top) diffs.push(Math.abs((best[e.top] || 0) - e.top_score));
    bmp.close();
  }
  log(`PARITY backend=${$('ep').value}: same top seal on ${agree}/${files.length} (${(100 * agree / files.length).toFixed(1)}%); score difference median ${pct(diffs, .5).toFixed(3)}, p90 ${pct(diffs, .9).toFixed(3)}, max ${pct(diffs, 1).toFixed(3)}`);
  try { localStorage.removeItem('spikeRunning'); } catch (e) {}
  bad.slice(0, 15).forEach(l => log('  mismatch ' + l));
}

// ---- 3. camera benchmark ----
async function bench() {
  if (!session) return log('Load the model first.');
  stop = false;
  const secs = Math.max(5, +$('secs').value || 30), video = $('video');
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    await video.play();
  } catch (e) { return log('CAMERA FAILED: ' + e + '  (the page needs HTTPS or a secure-context workaround)'); }
  const vw = video.videoWidth, vh = video.videoHeight;
  const pre = [], inf = [], post = [], tot = [], hzWin = [];
  const t0 = performance.now(); let n = 0, winStart = t0, winN = 0;
  while (!stop && performance.now() - t0 < secs * 1000) {
    const a = performance.now();
    const ratio = preprocess(video, vw, vh, true);
    const b = performance.now();
    const res = await session.run({ [inputName]: tensor() });
    const c = performance.now();
    const keep = postprocess(res[outputName].data, res[outputName].dims, ratio);
    const d = performance.now();
    pre.push(b - a); inf.push(c - b); post.push(d - c); tot.push(d - a); n++; winN++;
    if (d - winStart >= 10000) { hzWin.push((winN / ((d - winStart) / 1000)).toFixed(1)); winStart = d; winN = 0; }
    if (n % 5 === 0) {
      const top = topOf(bestByClass(keep)), el = (d - t0) / 1000;
      try { localStorage.setItem('spikeRunning', 'benchmark ' + n + ' frames at ' + el.toFixed(0) + ' s'); } catch (e) {}
      $('live').textContent = `t=${el.toFixed(0)}s frames=${n} Hz=${(n / el).toFixed(1)} top=${top.name} ${top.score.toFixed(2)} last=${(d - a).toFixed(0)} ms` +
        (performance.memory ? ` jsHeap=${(performance.memory.usedJSHeapSize / 1048576).toFixed(0)} MB` : '');
    }
  }
  video.srcObject.getTracks().forEach(t => t.stop());
  const el = (performance.now() - t0) / 1000;
  log(`BENCH backend=${$('ep').value} camera=${vw}x${vh} ${el.toFixed(0)}s frames=${n} mean ${(n / el).toFixed(1)} Hz`);
  log(`  per frame total ms: p50 ${pct(tot, .5).toFixed(0)}, p95 ${pct(tot, .95).toFixed(0)}, p99 ${pct(tot, .99).toFixed(0)}`);
  log(`  preprocess p50 ${pct(pre, .5).toFixed(0)} | inference p50 ${pct(inf, .5).toFixed(0)}, p95 ${pct(inf, .95).toFixed(0)} | postprocess p50 ${pct(post, .5).toFixed(0)}`);
  log(`  Hz per 10 s window: ${hzWin.join(', ') || 'run longer than 10 s'}`);
  try { localStorage.removeItem('spikeRunning'); } catch (e) {}
}

$('btnLoad').onclick = loadModel;
$('btnParity').onclick = parity;
$('btnBench').onclick = bench;
$('btnStop').onclick = () => { stop = true; };
</script>
</body>
</html>
